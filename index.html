<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-100 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Store - APK Download Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712 !important; color: #f8fafc !important; }
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-card:hover { transform: translateY(-8px); box-shadow: 0 25px 35px -5px rgba(59, 130, 246, 0.15), 0 10px 15px -5px rgba(0, 0, 0, 0.1); border-color: rgba(59, 130, 246, 0.4); }
        .modal-enter { animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Background Mesh Gradients */
        .bg
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f9fafb !important; color: #0f172a !important; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .app-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .app-card:hover { transform: translateY(-8px); box-shadow: 0 25px 35px -5px rgba(59, 130, 246, 0.08), 0 10px 15px -5px rgba(0, 0, 0, 0.03); border-color: rgba(59, 130, 246, 0.3); }
        .modal-enter { animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .glow-effect { background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(255,255,255,0) 70%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Navbar -->
    <nav class="glass-nav border-b border-gray-200/60 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5 cursor-pointer group" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-blue-500 to-indigo-600 flex items-center justify-center font-extrabold text-white shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform">S</div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-gray-900 via-gray-800 to-gray-600 bg-clip-text text-transparent">SUKII STORE</span>
            </div>
        </div>
    </nav>

    <!-- Hero / Search Section -->
    <header class="relative bg-white border-b border-gray-200/80 py-20 px-4 text-center overflow-hidden">
        <!-- Ambient Background Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] glow-effect pointer-events-none"></div>
        <div class="absolute inset-0 opacity-20 pointer-events-none bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:24px_24px]"></div>

        <div class="relative max-w-2xl mx-auto" data-aos="fade-up" data-aos-duration="700">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-blue-50 border border-blue-200/60 rounded-full text-xs font-bold text-blue-600 tracking-wide uppercase mb-6 shadow-sm">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Curated Android Software
            </div>
            <h1 class="text-4xl sm:text-6xl font-extrabold text-gray-900 mb-6 tracking-tight leading-[1.1]">
                Discover & Download <span class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Android APKs</span>
            </h1>
            <p class="text-gray-600 max-w-lg mx-auto text-base sm:text-lg mb-10 leading-relaxed font-normal">
                Lightning-fast direct access powered by permanent Internet Archive storage and Supabase cloud.
            </p>
            
            <div class="max-w-lg mx-auto relative group" data-aos="fade-up" data-aos-duration="800">
                <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps by name or developer..." class="w-full bg-gray-50/80 hover:bg-white focus:bg-white border border-gray-300/80 rounded-2xl px-6 py-4 pl-13 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 text-gray-900 text-sm sm:text-base shadow-sm transition-all">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-4.5 top-4.5 transition-colors group-focus-within:text-blue-600"></i>
            </div>
        </div>
    </header>

    <!-- Main Content / App Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-10" data-aos="fade-up" data-aos-duration="500">
            <h2 class="text-2xl font-extrabold text-gray-900 flex items-center gap-2.5 tracking-tight">
                <div class="w-8 h-8 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                </div> 
                Available Applications
            </h2>
            <div id="categoryFilters" class="flex flex-wrap gap-2 text-xs font-semibold">
                <button onclick="filterCategory('All')" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl transition shadow-md shadow-blue-600/25">All Apps</button>
                <button onclick="filterCategory('Games')" class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition shadow-sm">Games</button>
                <button onclick="filterCategory('Tools')" class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition shadow-sm">Tools</button>
                <button onclick="filterCategory('Social')" class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition shadow-sm">Social</button>
                <button onclick="filterCategory('Productivity')" class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition shadow-sm">Productivity</button>
            </div>
        </div>

        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400 flex flex-col items-center justify-center space-y-3">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-semibold tracking-wide">Loading store apps...</p>
            </div>
        </div>
    </main>

    <!-- App Details Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-center justify-center z-50 p-4 overflow-y-auto transition-opacity duration-300">
        <div class="bg-white border border-gray-100 rounded-3xl w-full max-w-2xl p-6 sm:p-8 relative shadow-2xl my-8 modal-enter">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center font-bold transition">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200/80 py-10 text-center text-xs text-gray-500 font-medium">
        <p>&copy; 2026 Sukii Store. Built with Supabase & Internet Archive.</p>
    </footer>

    <!-- JavaScript Store Logic & Interactivity -->
    <script>
        AOS.init({ once: true, offset: 50 });

        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allApps = [];
        let currentCategory = 'All';

        async function fetchStoreApps() {
            try {
                const { data, error } = await supabaseClient.from('apps').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allApps = data || [];
                renderApps(allApps);
            } catch (err) {
                console.error('Error loading apps:', err);
                document.getElementById('appGrid').innerHTML = `<div class="col-span-full text-center py-16 text-red-500 font-semibold bg-white border border-red-100 rounded-2xl shadow-sm">Failed to connect to Supabase backend database.</div>`;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-400 bg-white border border-gray-200 rounded-2xl shadow-sm" data-aos="fade-in">
                        <i data-lucide="package-open" class="w-12 h-12 mx-auto mb-3 text-gray-300"></i>
                        <p class="text-base font-bold text-gray-700">No applications found</p>
                        <p class="text-xs text-gray-400 mt-1">Try searching for a different keyword or category.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = apps.map((app, index) => {
                const iconSrc = app.icon_url || 'https://via.placeholder.com/64';
                return `
                    <div onclick="openAppDetail('${app.id}')" class="app-card bg-white border border-gray-200/80 rounded-2xl p-6 cursor-pointer flex flex-col justify-between shadow-sm" data-aos="fade-up" data-aos-delay="${index * 50}">
                        <div class="flex items-start space-x-4 mb-5">
                            <img src="${iconSrc}" class="w-16 h-16 rounded-2xl object-cover border border-gray-100 shadow-sm flex-shrink-0">
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-gray-900 text-base truncate mb-1">${app.title}</h3>
                                <p class="text-xs text-gray-500 truncate mb-3">${app.developer}</p>
                                <span class="px-3 py-1 bg-blue-50/80 border border-blue-100 rounded-full text-[11px] text-blue-600 font-bold inline-block">${app.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                            <span class="text-amber-500 text-xs font-bold flex items-center gap-1.5 bg-amber-50 px-2.5 py-1 rounded-lg">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-500"></i> ${app.rating ? app.rating.toFixed(1) : '5.0'}
                            </span>
                            <span class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition shadow-md shadow-blue-600/25 flex items-center gap-1.5">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Get APK
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = "px-4 py-2.5 bg-blue-600 text-white rounded-xl transition shadow-md shadow-blue-600/25";
                } else {
                    btn.className = "px-4 py-2.5 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition shadow-sm";
                }
            });
            applyFilters();
        }

        function filterApps() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchesCat = currentCategory === 'All' || app.category === currentCategory;
                const matchesSearch = app.title.toLowerCase().includes(query) || app.developer.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderApps(filtered);
        }

        function openAppDetail(id) {
            const app = allApps.find(a => a.id == id);
            if (!app) return;

            const iconSrc = app.icon_url || 'https://via.placeholder.com/80';
            
            let screenshotsHtml = '';
            if (app.screenshot_urls) {
                const shots = typeof app.screenshot_urls === 'string' ? app.screenshot_urls.split(',').map(s => s.trim()) : app.screenshot_urls;
                screenshotsHtml = shots.map(s => `<img src="${s}" class="w-32 h-56 object-cover rounded-2xl border border-gray-200 shadow-sm flex-shrink-0 hover:scale-[1.02] transition">`).join('');
            }

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-start space-x-4 mb-6">
                    <img src="${iconSrc}" class="w-20 h-20 rounded-2xl object-cover border border-gray-200 shadow-md flex-shrink-0">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-1">${app.title}</h2>
                        <p class="text-sm text-gray-500 mb-2">Developer: ${app.developer}</p>
                        <span class="px-3 py-1 bg-blue-50 border border-blue-100 rounded-full text-xs text-blue-600 font-bold">${app.category}</span>
                    </div>
                </div>
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-extrabold mb-2">About this app</h4>
                    <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50/80 p-5 rounded-2xl border border-gray-100">${app.description}</p>
                </div>
                ${screenshotsHtml ? `
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-extrabold mb-2">Screenshots</h4>
                    <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-thin">${screenshotsHtml}</div>
                </div>` : ''}
                <div class="flex justify-end space-x-3 pt-5 border-t border-gray-100">
                    <button onclick="closeDetailModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-bold transition">Close</button>
                    <a href="${app.apk_url}" target="_blank" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Download APK
                    </a>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
            lucide.createIcons();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        fetchStoreApps();
    </script>
</body>
</html>
