<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Store - APK Download Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #f9fafb !important; color: #111827 !important; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .app-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .app-card:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .modal-enter { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Navbar -->
    <nav class="glass-nav border-b border-gray-200/80 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/20">S</div>
                <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">SUKII STORE</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="admin.html" class="px-4 py-2 text-sm font-semibold text-gray-600 hover:text-blue-600 hover:bg-blue-50/50 rounded-xl transition flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Admin Portal
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero / Search Section -->
    <header class="bg-gradient-to-b from-white to-gray-50 border-b border-gray-200 py-16 px-4 text-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-30 pointer-events-none bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="relative max-w-2xl mx-auto" data-aos="fade-up" data-aos-duration="600">
            <span class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded-full text-xs font-bold tracking-wide uppercase inline-block mb-4 shadow-sm">🚀 Next-Gen APK Hub</span>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Discover & Download Android Apps</h1>
            <p class="text-gray-600 max-w-lg mx-auto text-sm sm:text-base mb-8 leading-relaxed">Lightning-fast direct access powered by permanent Internet Archive storage and Supabase.</p>
            
            <div class="max-w-md mx-auto relative group">
                <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps by name or developer..." class="w-full bg-white border border-gray-300 rounded-2xl px-5 py-3.5 pl-12 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 text-gray-900 text-sm shadow-sm transition-all">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-4 top-4 transition-colors group-focus-within:text-blue-600"></i>
            </div>
        </div>
    </header>

    <!-- Main Content / App Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8" data-aos="fade-up" data-aos-duration="500">
            <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                <i data-lucide="grid" class="w-5 h-5 text-blue-600"></i> Available Apps
            </h2>
            <div id="categoryFilters" class="flex flex-wrap gap-2 text-xs font-semibold">
                <button onclick="filterCategory('All')" class="px-4 py-2 bg-blue-600 text-white rounded-xl transition shadow-md shadow-blue-600/20">All</button>
                <button onclick="filterCategory('Games')" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition">Games</button>
                <button onclick="filterCategory('Tools')" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition">Tools</button>
                <button onclick="filterCategory('Social')" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition">Social</button>
                <button onclick="filterCategory('Productivity')" class="px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition">Productivity</button>
            </div>
        </div>

        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16 text-gray-400 flex flex-col items-center justify-center space-y-3">
                <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium">Loading store apps...</p>
            </div>
        </div>
    </main>

    <!-- App Details Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-center justify-center z-50 p-4 overflow-y-auto transition-opacity duration-300">
        <div class="bg-white border border-gray-200 rounded-3xl w-full max-w-2xl p-6 sm:p-8 relative shadow-2xl my-8 modal-enter">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 w-8 h-8 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center font-bold transition">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 Sukii Store. Built with Supabase & Internet Archive.</p>
    </footer>

    <!-- JavaScript Store Logic & Interactivity -->
    <script>
        // Initialize AOS animations
        AOS.init({ once: true, offset: 50 });

        // REPLACE WITH YOUR SUPABASE URL AND ANON KEY
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allApps = [];
        let currentCategory = 'All';

        async function fetchStoreApps() {
            try {
                const { data, error } = await supabaseClient.from('apps').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allApps = data || [];
                renderApps(allApps);
            } catch (err) {
                console.error('Error loading apps:', err);
                document.getElementById('appGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500 font-medium">Failed to connect to Supabase backend database.</div>`;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-400 bg-white border border-gray-200 rounded-2xl" data-aos="fade-in">
                        <i data-lucide="package-open" class="w-10 h-10 mx-auto mb-2 text-gray-300"></i>
                        <p class="text-sm font-semibold text-gray-600">No apps found</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = apps.map((app, index) => {
                const iconSrc = app.icon_url || 'https://via.placeholder.com/64';
                return `
                    <div onclick="openAppDetail('${app.id}')" class="app-card bg-white border border-gray-200/80 rounded-2xl p-6 cursor-pointer flex flex-col justify-between" data-aos="fade-up" data-aos-delay="${index * 50}">
                        <div class="flex items-start space-x-4 mb-4">
                            <img src="${iconSrc}" class="w-16 h-16 rounded-2xl object-cover border border-gray-100 shadow-sm flex-shrink-0">
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-gray-900 text-base truncate mb-1">${app.title}</h3>
                                <p class="text-xs text-gray-500 truncate mb-2.5">${app.developer}</p>
                                <span class="px-2.5 py-1 bg-gray-50 border border-gray-200 rounded-full text-[11px] text-blue-600 font-semibold inline-block">${app.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                            <span class="text-amber-500 text-xs font-bold flex items-center gap-1">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-500"></i> ${app.rating ? app.rating.toFixed(1) : '5.0'}
                            </span>
                            <span class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition shadow-sm shadow-blue-600/20 flex items-center gap-1.5">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Get
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "px-4 py-2 bg-blue-600 text-white rounded-xl transition shadow-md shadow-blue-600/20";
                } else {
                    btn.className = "px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 rounded-xl transition";
                }
            });
            applyFilters();
        }

        function filterApps() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchesCat = currentCategory === 'All' || app.category === currentCategory;
                const matchesSearch = app.title.toLowerCase().includes(query) || app.developer.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderApps(filtered);
        }

        function openAppDetail(id) {
            const app = allApps.find(a => a.id == id);
            if (!app) return;

            const iconSrc = app.icon_url || 'https://via.placeholder.com/80';
            
            let screenshotsHtml = '';
            if (app.screenshot_urls) {
                const shots = typeof app.screenshot_urls === 'string' ? app.screenshot_urls.split(',').map(s => s.trim()) : app.screenshot_urls;
                screenshotsHtml = shots.map(s => `<img src="${s}" class="w-32 h-56 object-cover rounded-2xl border border-gray-200 shadow-sm flex-shrink-0 hover:scale-[1.02] transition">`).join('');
            }

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-start space-x-4 mb-6">
                    <img src="${iconSrc}" class="w-20 h-20 rounded-2xl object-cover border border-gray-200 shadow-md flex-shrink-0">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-1">${app.title}</h2>
                        <p class="text-sm text-gray-500 mb-2">Developer: ${app.developer}</p>
                        <span class="px-3 py-1 bg-gray-100 border border-gray-200 rounded-full text-xs text-blue-600 font-semibold">${app.category}</span>
                    </div>
                </div>
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-2">About this app</h4>
                    <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-2xl border border-gray-100">${app.description}</p>
                </div>
                ${screenshotsHtml ? `
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-2">Screenshots</h4>
                    <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-thin">${screenshotsHtml}</div>
                </div>` : ''}
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button onclick="closeDetailModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-semibold transition">Close</button>
                    <a href="${app.apk_url}" target="_blank" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Download APK
                    </a>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
            lucide.createIcons();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        fetchStoreApps();
    </script>
</body>
</html>
