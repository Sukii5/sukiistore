<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Store - APK Download Center</title>
    
    <!-- Browser Tab Favicon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'></path><polyline points='7 10 12 15 17 10'></polyline><line x1='12' y1='15' x2='12' y2='3'></line></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        cardHover: '#1f2937',
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16 !important; color: #f3f4f6 !important; }
        .glass-nav { background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-card { background: #111827; border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-card:hover { transform: translateY(-6px); background: #162032; border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 20px 30px -10px rgba(59, 130, 246, 0.15); }
        .modal-enter { animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Navbar with Brand Logo -->
    <nav class="glass-nav border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5 cursor-pointer group" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <!-- Custom App Store Logo Icon -->
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent block">SUKII STORE</span>
                    <span class="text-[10px] tracking-widest text-blue-400 font-bold uppercase block -mt-1">APK Hub</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero / Search Section -->
    <header class="relative py-20 px-4 text-center overflow-hidden border-b border-gray-800/60 bg-[#0c1220]">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[250px] bg-blue-600/10 blur-[100px] pointer-events-none rounded-full"></div>

        <div class="relative max-w-2xl mx-auto" data-aos="fade-up" data-aos-duration="600">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-blue-500/10 border border-blue-500/20 rounded-full text-xs font-bold text-blue-400 tracking-wide uppercase mb-5 shadow-sm">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Secure Direct Downloads
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-5 tracking-tight leading-tight">
                Discover & Download <span class="bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">Android APKs</span>
            </h1>
            <p class="text-gray-400 max-w-lg mx-auto text-sm sm:text-base mb-8 leading-relaxed">
                Lightning-fast direct access powered by permanent Internet Archive storage and Supabase cloud.
            </p>
            
            <div class="max-w-md mx-auto relative group" data-aos="fade-up" data-aos-duration="700">
                <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps by name or developer..." class="w-full bg-[#111827] hover:bg-[#162032] focus:bg-[#162032] border border-gray-800 focus:border-blue-500 rounded-2xl px-5 py-4 pl-12 focus:outline-none focus:ring-4 focus:ring-blue-500/15 text-white text-sm shadow-xl transition-all placeholder:text-gray-500">
                <i data-lucide="search" class="w-5 h-5 text-gray-500 absolute left-4 top-4 transition-colors group-focus-within:text-blue-400"></i>
            </div>
        </div>
    </header>

    <!-- Main Content / App Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8" data-aos="fade-up" data-aos-duration="500">
            <h2 class="text-xl font-extrabold text-white flex items-center gap-2.5 tracking-tight">
                <div class="w-8 h-8 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                </div> 
                Available Applications
            </h2>
            <div id="categoryFilters" class="flex flex-wrap gap-2 text-xs font-semibold">
                <button onclick="filterCategory('All')" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl transition shadow-lg shadow-blue-600/25">All Apps</button>
                <button onclick="filterCategory('Games')" class="px-4 py-2.5 glass-card text-gray-300 hover:text-white rounded-xl transition">Games</button>
                <button onclick="filterCategory('Tools')" class="px-4 py-2.5 glass-card text-gray-300 hover:text-white rounded-xl transition">Tools</button>
                <button onclick="filterCategory('Social')" class="px-4 py-2.5 glass-card text-gray-300 hover:text-white rounded-xl transition">Social</button>
                <button onclick="filterCategory('Productivity')" class="px-4 py-2.5 glass-card text-gray-300 hover:text-white rounded-xl transition">Productivity</button>
            </div>
        </div>

        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-500 flex flex-col items-center justify-center space-y-3">
                <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-semibold tracking-wide">Loading store apps...</p>
            </div>
        </div>
    </main>

    <!-- App Details Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto transition-opacity duration-300">
        <div class="glass-card bg-[#111827] border border-gray-800 rounded-3xl w-full max-w-2xl p-6 sm:p-8 relative shadow-2xl my-8 modal-enter">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 w-9 h-9 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full flex items-center justify-center font-bold transition">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-[#0c1220] border-t border-gray-800/80 py-8 text-center text-xs text-gray-500 font-medium">
        <p>&copy; 2026 Sukii Store. Built with Supabase & Internet Archive.</p>
    </footer>

    <!-- JavaScript Store Logic & Interactivity -->
    <script>
        AOS.init({ once: true, offset: 50 });

        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allApps = [];
        let currentCategory = 'All';

        async function fetchStoreApps() {
            try {
                const { data, error } = await supabaseClient.from('apps').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allApps = data || [];
                renderApps(allApps);
            } catch (err) {
                console.error('Error loading apps:', err);
                document.getElementById('appGrid').innerHTML = `<div class="col-span-full text-center py-16 text-rose-400 font-semibold glass-card rounded-2xl">Failed to connect to Supabase backend database.</div>`;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-400 glass-card rounded-2xl" data-aos="fade-in">
                        <i data-lucide="package-open" class="w-12 h-12 mx-auto mb-3 text-gray-500"></i>
                        <p class="text-base font-bold text-white">No applications found</p>
                        <p class="text-xs text-gray-400 mt-1">Try searching for a different keyword or category.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = apps.map((app, index) => {
                const iconSrc = app.icon_url || 'https://via.placeholder.com/64';
                return `
                    <div onclick="openAppDetail('${app.id}')" class="glass-card rounded-2xl p-6 cursor-pointer flex flex-col justify-between" data-aos="fade-up" data-aos-delay="${index * 40}">
                        <div class="flex items-start space-x-4 mb-5">
                            <img src="${iconSrc}" class="w-16 h-16 rounded-2xl object-cover border border-gray-800 shadow-sm flex-shrink-0">
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-white text-base truncate mb-1">${app.title}</h3>
                                <p class="text-xs text-gray-400 truncate mb-3">${app.developer}</p>
                                <span class="px-3 py-1 bg-blue-500/10 border border-blue-500/20 rounded-full text-[11px] text-blue-400 font-bold inline-block">${app.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-gray-800/80">
                            <span class="text-amber-400 text-xs font-bold flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-lg">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i> ${app.rating ? app.rating.toFixed(1) : '5.0'}
                            </span>
                            <span class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-600/25 flex items-center gap-1.5">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Get APK
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = "px-4 py-2.5 bg-blue-600 text-white rounded-xl transition shadow-lg shadow-blue-600/25";
                } else {
                    btn.className = "px-4 py-2.5 glass-card text-gray-300 hover:text-white rounded-xl transition";
                }
            });
            applyFilters();
        }

        function filterApps() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchesCat = currentCategory === 'All' || app.category === currentCategory;
                const matchesSearch = app.title.toLowerCase().includes(query) || app.developer.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderApps(filtered);
        }

        function openAppDetail(id) {
            const app = allApps.find(a => a.id == id);
            if (!app) return;

            const iconSrc = app.icon_url || 'https://via.placeholder.com/80';
            
            let screenshotsHtml = '';
            if (app.screenshot_urls) {
                const shots = typeof app.screenshot_urls === 'string' ? app.screenshot_urls.split(',').map(s => s.trim()) : app.screenshot_urls;
                screenshotsHtml = shots.map(s => `<img src="${s}" class="w-32 h-56 object-cover rounded-2xl border border-gray-800 shadow-sm flex-shrink-0 hover:scale-[1.02] transition">`).join('');
            }

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-start space-x-4 mb-6">
                    <img src="${iconSrc}" class="w-20 h-20 rounded-2xl object-cover border border-gray-800 shadow-md flex-shrink-0">
                    <div>
                        <h2 class="text-2xl font-bold text-white mb-1">${app.title}</h2>
                        <p class="text-sm text-gray-400 mb-2">Developer: ${app.developer}</p>
                        <span class="px-3 py-1 bg-blue-500/10 border border-blue-500/20 rounded-full text-xs text-blue-400 font-bold">${app.category}</span>
                    </div>
                </div>
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-extrabold mb-2">About this app</h4>
                    <p class="text-sm text-gray-300 leading-relaxed whitespace-pre-line bg-[#090d16] p-5 rounded-2xl border border-gray-800">${app.description}</p>
                </div>
                ${screenshotsHtml ? `
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-400 font-extrabold mb-2">Screenshots</h4>
                    <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-thin">${screenshotsHtml}</div>
                </div>` : ''}
                <div class="flex justify-end space-x-3 pt-5 border-t border-gray-800">
                    <button onclick="closeDetailModal()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-bold transition">Close</button>
                    <a href="${app.apk_url}" target="_blank" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-600/30 flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Download APK
                    </a>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
            lucide.createIcons();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        fetchStoreApps();
    </script>
</body>
</html>
