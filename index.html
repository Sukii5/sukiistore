<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Store - APK Download Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #f9fafb !important; color: #111827 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">S</div>
                <span class="text-xl font-bold tracking-wider text-gray-900">SUKII STORE</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="admin.html" class="px-4 py-2 text-sm font-semibold text-gray-600 hover:text-blue-600 transition">Admin Portal</a>
            </div>
        </div>
    </nav>

    <!-- Hero / Search Section -->
    <header class="bg-white border-b border-gray-200 py-12 px-4 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-3">Discover & Download Android APKs</h1>
        <p class="text-gray-600 max-w-xl mx-auto text-sm mb-6">Safe, fast, and lightweight direct downloads powered by Internet Archive & Supabase.</p>
        <div class="max-w-md mx-auto relative">
            <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps by name or developer..." class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 pl-10 focus:outline-none focus:border-blue-600 text-gray-900 text-sm shadow-sm">
            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
    </header>

    <!-- Main Content / App Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-gray-900">Available Apps</h2>
            <div id="categoryFilters" class="flex flex-wrap gap-2 text-xs font-semibold">
                <button onclick="filterCategory('All')" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg transition">All</button>
                <button onclick="filterCategory('Games')" class="px-3 py-1.5 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg transition">Games</button>
                <button onclick="filterCategory('Tools')" class="px-3 py-1.5 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg transition">Tools</button>
                <button onclick="filterCategory('Social')" class="px-3 py-1.5 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg transition">Social</button>
                <button onclick="filterCategory('Productivity')" class="px-3 py-1.5 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg transition">Productivity</button>
            </div>
        </div>

        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-500">Loading store apps...</div>
        </div>
    </main>

    <!-- App Details Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-2xl p-6 relative shadow-2xl my-8">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        &copy; 2026 Sukii Store. Powered by Supabase & Internet Archive.
    </footer>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allApps = [];
        let currentCategory = 'All';

        async function fetchStoreApps() {
            try {
                const { data, error } = await supabaseClient.from('apps').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allApps = data || [];
                renderApps(allApps);
            } catch (err) {
                console.error('Error loading apps:', err);
                document.getElementById('appGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Failed to connect to Supabase backend database.</div>`;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            if (apps.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No apps found.</div>`;
                return;
            }

            grid.innerHTML = apps.map(app => {
                const iconSrc = app.icon_url || 'https://via.placeholder.com/64';
                return `
                    <div onclick="openAppDetail('${app.id}')" class="bg-white border border-gray-200 rounded-2xl p-5 hover:shadow-md transition cursor-pointer flex flex-col justify-between">
                        <div class="flex items-start space-x-4 mb-4">
                            <img src="${iconSrc}" class="w-14 h-14 rounded-xl object-cover border border-gray-200 flex-shrink-0">
                            <div>
                                <h3 class="font-bold text-gray-900 text-base mb-1">${app.title}</h3>
                                <p class="text-xs text-gray-500 mb-2">${app.developer}</p>
                                <span class="px-2 py-0.5 bg-gray-100 border border-gray-200 rounded-full text-xs text-blue-600 font-medium">${app.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <span class="text-amber-500 text-xs font-bold">★ ${app.rating ? app.rating.toFixed(1) : '0.0'}</span>
                            <span class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition">Download</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "px-3 py-1.5 bg-blue-600 text-white rounded-lg transition";
                } else {
                    btn.className = "px-3 py-1.5 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg transition";
                }
            });
            applyFilters();
        }

        function filterApps() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchesCat = currentCategory === 'All' || app.category === currentCategory;
                const matchesSearch = app.title.toLowerCase().includes(query) || app.developer.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderApps(filtered);
        }

        function openAppDetail(id) {
            const app = allApps.find(a => a.id == id);
            if (!app) return;

            const iconSrc = app.icon_url || 'https://via.placeholder.com/80';
            
            let screenshotsHtml = '';
            if (app.screenshot_urls) {
                const shots = typeof app.screenshot_urls === 'string' ? app.screenshot_urls.split(',').map(s => s.trim()) : app.screenshot_urls;
                screenshotsHtml = shots.map(s => `<img src="${s}" class="w-32 h-56 object-cover rounded-xl border border-gray-200 flex-shrink-0">`).join('');
            }

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-start space-x-4 mb-6">
                    <img src="${iconSrc}" class="w-20 h-20 rounded-2xl object-cover border border-gray-200 shadow-sm flex-shrink-0">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-1">${app.title}</h2>
                        <p class="text-sm text-gray-500 mb-2">Developer: ${app.developer}</p>
                        <span class="px-3 py-1 bg-gray-100 border border-gray-200 rounded-full text-xs text-blue-600 font-semibold">${app.category}</span>
                    </div>
                </div>
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">About this app</h4>
                    <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">${app.description}</p>
                </div>
                ${screenshotsHtml ? `
                <div class="mb-6">
                    <h4 class="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">Screenshots</h4>
                    <div class="flex space-x-3 overflow-x-auto pb-2">${screenshotsHtml}</div>
                </div>` : ''}
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button onclick="closeDetailModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-semibold transition">Close</button>
                    <a href="${app.apk_url}" target="_blank" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition shadow">Download APK</a>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        fetchStoreApps();
    </script>
</body>
</html>
