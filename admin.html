<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Store - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased bg-zinc-50 min-h-screen text-zinc-900">

    <!-- Admin Header -->
    <header class="border-b bg-white sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-lg font-bold">Admin Dashboard</h1>
            <a href="index.html" class="text-xs font-semibold px-3 py-1.5 bg-zinc-100 hover:bg-zinc-200 rounded-lg">View Store</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold mb-6">Manage Store Apps</h2>
        
        <!-- App List Container -->
        <div id="adminAppList" class="space-y-3">
            <!-- Dynamically populated app items with Edit buttons -->
        </div>
    </main>

    <!-- Edit App Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl">
            <h3 class="text-xl font-bold text-zinc-900 mb-4">Edit App Details</h3>
            <form id="editAppForm" class="space-y-4">
                <input type="hidden" id="editAppId">
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">App Title</label>
                    <input type="text" id="editTitle" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-teal-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">Category</label>
                    <input type="text" id="editCategory" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-teal-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">Developer</label>
                    <input type="text" id="editDeveloper" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-teal-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">Description</label>
                    <textarea id="editDescription" rows="3" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-teal-600"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">APK Download URL</label>
                    <input type="url" id="editApkUrl" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-teal-600">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-zinc-100 text-zinc-700 rounded-xl text-sm font-semibold hover:bg-zinc-200">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-sm font-semibold hover:bg-teal-700">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const PB_URL = "https://your-pocketbase-app.onrender.com"; // UPDATE WITH YOUR RENDER URL

        async function loadAdminApps() {
            try {
                const res = await fetch(`${PB_URL}/api/collections/apps/records`);
                const data = await res.json();
                const listContainer = document.getElementById('adminAppList');
                listContainer.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    listContainer.innerHTML = '<p class="text-zinc-500 text-sm">No apps found in database.</p>';
                    return;
                }

                data.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-4 bg-white border rounded-2xl shadow-sm';
                    row.innerHTML = `
                        <div>
                            <h4 class="font-bold text-zinc-900">${escapeHtml(item.title)}</h4>
                            <p class="text-xs text-zinc-500 mt-0.5">${escapeHtml(item.category || 'App')} • By ${escapeHtml(item.developer || 'Unknown')}</p>
                        </div>
                        <button onclick="openEditModal('${item.id}')" class="px-4 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-semibold rounded-xl transition">
                            Edit
                        </button>
                    `;
                    listContainer.appendChild(row);
                });
            } catch (err) {
                console.error('Failed to load admin apps:', err);
            }
        }

        async function openEditModal(appId) {
            try {
                const res = await fetch(`${PB_URL}/api/collections/apps/records/${appId}`);
                const app = await res.json();

                document.getElementById('editAppId').value = app.id;
                document.getElementById('editTitle').value = app.title || '';
                document.getElementById('editCategory').value = app.category || '';
                document.getElementById('editDeveloper').value = app.developer || '';
                document.getElementById('editDescription').value = app.description || '';
                document.getElementById('editApkUrl').value = app.apkurl || '';

                document.getElementById('editModal').classList.remove('hidden');
            } catch (err) {
                alert('Failed to fetch app details.');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        document.getElementById('editAppForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const appId = document.getElementById('editAppId').value;

            const updatedData = {
                title: document.getElementById('editTitle').value,
                category: document.getElementById('editCategory').value,
                developer: document.getElementById('editDeveloper').value,
                description: document.getElementById('editDescription').value,
                apkurl: document.getElementById('editApkUrl').value
            };

            const response = await fetch(`${PB_URL}/api/collections/apps/records/${appId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (response.ok) {
                alert('App updated successfully in database!');
                closeEditModal();
                loadAdminApps();
            } else {
                alert('Failed to update app details.');
            }
        });

        function escapeHtml(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        loadAdminApps();
    </script>
</body>
</html>
