<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukii Admin - Manage Store Apps</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #f9fafb !important; color: #111827 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">S</div>
                <span class="text-xl font-bold tracking-wider text-gray-900">SUKII ADMIN</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="index.html" class="px-4 py-2 text-sm font-semibold text-gray-600 hover:text-blue-600 transition">View Store</a>
                <button onclick="openAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-sm">+ Add New App</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Manage Store Apps</h1>
        
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-200 bg-gray-50 text-xs uppercase tracking-wider text-gray-500 font-semibold">
                        <th class="p-4">App Title</th>
                        <th class="p-4">Category</th>
                        <th class="p-4">Developer</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="4" class="p-6 text-center text-gray-500">Loading apps...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="appModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-xl p-6 relative shadow-2xl my-8">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            <h2 id="modalTitle" class="text-xl font-bold text-gray-900 mb-4">Add New App</h2>
            
            <form id="appForm" onsubmit="saveApp(event)" class="space-y-4 text-sm">
                <input type="hidden" id="appId">
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">App Title</label>
                    <input type="text" id="title" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Category</label>
                        <select id="category" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                            <option value="Games">Games</option>
                            <option value="Tools">Tools</option>
                            <option value="Social">Social</option>
                            <option value="Productivity">Productivity</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Developer</label>
                        <input type="text" id="developer" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Description</label>
                    <textarea id="description" rows="3" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Internet Archive APK Download URL</label>
                    <input type="url" id="apk_url" placeholder="https://archive.org/download/.../app.apk" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Internet Archive Icon Image URL</label>
                    <input type="url" id="icon_url" placeholder="https://archive.org/download/.../icon.png" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Internet Archive Screenshot URLs (Comma-separated)</label>
                    <input type="text" id="screenshot_urls" placeholder="https://..., https://..." class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 text-gray-900">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-semibold transition">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition shadow">Save App</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let appsList = [];

        async function fetchAdminApps() {
            try {
                const { data, error } = await supabaseClient.from('apps').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                appsList = data || [];
                renderTable(appsList);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('adminTableBody').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">Failed to connect to Supabase database.</td></tr>`;
            }
        }

        function renderTable(apps) {
            const tbody = document.getElementById('adminTableBody');
            if (apps.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">No apps found in database.</td></tr>`;
                return;
            }

            tbody.innerHTML = apps.map(app => `
                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                    <td class="p-4 font-bold text-gray-900 flex items-center space-x-3">
                        <img src="${app.icon_url || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-lg object-cover border border-gray-200">
                        <span>${app.title}</span>
                    </td>
                    <td class="p-4 text-gray-600"><span class="px-2.5 py-1 bg-gray-100 border border-gray-200 rounded-full text-xs text-blue-600 font-semibold">${app.category}</span></td>
                    <td class="p-4 text-gray-600">${app.developer}</td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="editApp('${app.id}')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-semibold transition">Edit</button>
                        <button onclick="deleteApp('${app.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-semibold transition">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Add New App';
            document.getElementById('appForm').reset();
            document.getElementById('appId').value = '';
            document.getElementById('appModal').classList.remove('hidden');
            document.getElementById('appModal').classList.add('flex');
        }

        function editApp(id) {
            const app = appsList.find(a => a.id == id);
            if (!app) return;

            document.getElementById('modalTitle').innerText = 'Edit App';
            document.getElementById('appId').value = app.id;
            document.getElementById('title').value = app.title;
            document.getElementById('category').value = app.category;
            document.getElementById('developer').value = app.developer;
            document.getElementById('description').value = app.description;
            document.getElementById('apk_url').value = app.apk_url || '';
            document.getElementById('icon_url').value = app.icon_url || '';
            document.getElementById('screenshot_urls').value = app.screenshot_urls || '';

            document.getElementById('appModal').classList.remove('hidden');
            document.getElementById('appModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
            document.getElementById('appModal').classList.remove('flex');
        }

        async function saveApp(event) {
            event.preventDefault();
            const id = document.getElementById('appId').value;
            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                developer: document.getElementById('developer').value,
                description: document.getElementById('description').value,
                apk_url: document.getElementById('apk_url').value,
                icon_url: document.getElementById('icon_url').value,
                screenshot_urls: document.getElementById('screenshot_urls').value
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('apps').update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('apps').insert([payload]);
                    if (error) throw error;
                }
                closeModal();
                fetchAdminApps();
            } catch (err) {
                alert('Error saving app: ' + err.message);
            }
        }

        async function deleteApp(id) {
            if (!confirm('Are you sure you want to delete this app record?')) return;
            try {
                const { error } = await supabaseClient.from('apps').delete().eq('id', id);
                if (error) throw error;
                fetchAdminApps();
            } catch (err) {
                alert('Error deleting app: ' + err.message);
            }
        }

        fetchAdminApps();
    </script>
</body>
</html>
